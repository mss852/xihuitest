      // ---------- 状态 ----------
      let currentQuestionIndex = 0; // 0~14
      let userAnswers = new Array(15).fill(null); // 存储每题选择的选项索引 (0~3)
      let scores = new Array(10).fill(0); // 十个角色的累计得分
      let selectedOptionIndex = null; // 当前题目选择的选项索引

      // DOM 元素
      const coverSection = document.getElementById('coverSection');
      const quizSection = document.getElementById('quizSection');
      const resultSection = document.getElementById('resultSection');
      const startBtn = document.getElementById('startBtn');
      const nextBtn = document.getElementById('nextBtn');
      const retestBtn = document.getElementById('retestBtn');
      const progressText = document.getElementById('progressText');
      const questionCounter = document.getElementById('questionCounter');
      const questionText = document.getElementById('questionText');
      const optionsContainer = document.getElementById('optionsContainer');

      // 结果页元素
      const resultCharacter = document.getElementById('resultCharacter');
      const resultEmoji = document.getElementById('resultEmoji');
      const resultTagline = document.getElementById('resultTagline');
      const resultCopy = document.getElementById('resultCopy');

      // ---------- 辅助函数 ----------
      function resetState() {
        currentQuestionIndex = 0;
        userAnswers = new Array(15).fill(null);
        scores = new Array(10).fill(0);
        selectedOptionIndex = null;
        // 清空界面
        coverSection.classList.remove('hidden');
        quizSection.classList.remove('active');
        resultSection.classList.remove('active');
        // 重置按钮状态
        nextBtn.disabled = true;
      }

      // 显示题目
      function renderQuestion(index) {
        const q = questions[index];
        if (!q) return;

        // 更新进度
        progressText.textContent = `第 ${index + 1} / 15 题`;
        questionCounter.textContent = `${index + 1}/15`;
        questionText.textContent = q.text;

        // 生成选项
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, optIdx) => {
          const div = document.createElement('div');
          div.className = 'option-item' + (userAnswers[index] === optIdx ? ' selected' : '');
          div.dataset.optionIndex = optIdx;

          const radio = document.createElement('span');
          radio.className = 'radio-indicator';

          const textSpan = document.createElement('span');
          textSpan.textContent = opt.text;

          div.appendChild(radio);
          div.appendChild(textSpan);

          div.addEventListener('click', () => {
            // 清除同题其他选中状态
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('selected'));
            div.classList.add('selected');
            selectedOptionIndex = optIdx;
            // 记录答案
            userAnswers[currentQuestionIndex] = optIdx;
            nextBtn.disabled = false;
          });

          optionsContainer.appendChild(div);
        });

        // 如果该题已选择过，恢复按钮状态
        if (userAnswers[index] !== null) {
          selectedOptionIndex = userAnswers[index];
          nextBtn.disabled = false;
        } else {
          selectedOptionIndex = null;
          nextBtn.disabled = true;
        }
      }

      // 计算最终得分，返回角色索引
      function calculateResult() {
        // 重置得分
        scores = new Array(10).fill(0);
        for (let i = 0; i < questions.length; i++) {
          const answerIdx = userAnswers[i];
          if (answerIdx === null) continue; // 跳过未答（理论上全部已答）
          const selectedOption = questions[i].options[answerIdx];
          const optionScores = selectedOption.scores;
          for (const charIndex in optionScores) {
            if (Object.prototype.hasOwnProperty.call(optionScores, charIndex)) {
              scores[charIndex] += optionScores[charIndex];
            }
          }
        }
        // 找出最高分角色
        let maxScore = -1;
        let maxIndex = 0;
        for (let i = 0; i < scores.length; i++) {
          if (scores[i] > maxScore) {
            maxScore = scores[i];
            maxIndex = i;
          }
        }
        return maxIndex;
      }

      // 显示结果页
      function showResult() {
        const charIndex = calculateResult();
        const detail = characterDetails[charIndex];
        resultCharacter.textContent = detail.name;
        resultEmoji.textContent = detail.emoji;
        resultTagline.textContent = `“${detail.tagline}”`;
        resultCopy.innerHTML = detail.copy;

        // 切换到结果页
        coverSection.classList.add('hidden');
        quizSection.classList.remove('active');
        resultSection.classList.add('active');
      }

      // ---------- 事件绑定 ----------
      startBtn.addEventListener('click', () => {
        // 重置所有状态
        resetState();
        currentQuestionIndex = 0;
        userAnswers = new Array(15).fill(null);
        // 隐藏封面，显示答题
        coverSection.classList.add('hidden');
        resultSection.classList.remove('active');
        quizSection.classList.add('active');
        renderQuestion(0);
      });

      nextBtn.addEventListener('click', () => {
        // 确保当前题目已选择
        if (userAnswers[currentQuestionIndex] === null) return;

        // 如果是最后一题，直接计算结果
        if (currentQuestionIndex === questions.length - 1) {
          // 检查所有题目是否已答
          const allAnswered = userAnswers.every(ans => ans !== null);
          if (!allAnswered) {
            alert('请先回答所有题目～');
            return;
          }
          showResult();
          return;
        }

        // 否则移动到下一题
        currentQuestionIndex++;
        renderQuestion(currentQuestionIndex);
      });

      retestBtn.addEventListener('click', () => {
        // 完全重置
        resetState();
        // 再额外清理结果页
        resultSection.classList.remove('active');
        // 显示封面
        coverSection.classList.remove('hidden');
        quizSection.classList.remove('active');
      });

      // 初始化：确保封面可见，隐藏其他
      resetState();

    })();
  </script>
